[package]
name = "mercurial-player"
# 运行`pnpm run version:sync`以同步
version = "1.4.2"
description = "A music player by JDBeWL"
authors = ["jdbEwl"]
license = "GPL-3.0"
repository = "https://github.com/JDBeWL/Mercurial-Player"
edition = "2024"
rust-version = "1.92"
default-run = "mercurial-player"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["protocol-asset", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rodio = { version = "0.22", default-features = false, features = ["playback"] }
cpal = "0.17"
dirs = "6"
walkdir = "2"
lofty = "0.24"
# 启用Symphonia所有格式和编解码器
symphonia = { version = "0.6", features = ["all"] }
rubato = "4.0"
audioadapter-buffers = "4.0"
rayon = "1"
spectrum-analyzer = "1.7"
log = "0.4"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.7"
tauri-plugin-fs = "2.5"
tauri-plugin-http = { version = "2.5", features = ["stream"] }
tauri-plugin-opener = "2.5"
tauri-plugin-process = "2.3"
tauri-plugin-updater = "2"
tauri-plugin-store = "2.4"
tauri-plugin-global-shortcut = "2.3"

crossbeam-channel = "0.5"
display-info = "0.5"
unicode-segmentation = "1"
# async sleep 用于将阻塞的播放命令改为 async,避免阻塞 Tauri 命令线程;
# fs + io-util 用于更新包分片流式落盘
tokio = { version = "1", features = ["time", "fs", "io-util"] }
ttf-parser = "0.25.1"
futures-util = "0.3"
minisign-verify = "0.2"
base64 = "0.22"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "decode"
harness = false

[[bench]]
name = "equalizer"
harness = false

[target.'cfg(windows)'.dependencies]
wasapi = "0.23"
winreg = "0.56"
# windows-core 和 windows-implement 需要作为直接依赖，
# 因为 #[windows::core::implement] 宏生成的代码直接引用 windows_core:: 路径
windows-core = "0.62"
windows-implement = "0.60"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Media_Audio",
] }
windows-numerics = "0.3"


[lints.rust]
unsafe_code = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_qualifications = "warn"
variant_size_differences = "warn"
keyword_idents_2024 = "forbid"
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
# 基础lint组
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Tauri框架限制
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
needless_pass_by_value = "allow"  # Tauri命令需要owned类型
must_use_candidate = "allow"      # Tauri命令返回值由框架处理
# 音频处理常见模式
cast_precision_loss = "allow"     # u32 -> f32在音频处理中常见
cast_possible_truncation = "allow" # 频率显示截断是预期行为
cast_possible_wrap = "allow"      # Win32 API 常量(u32)转 i32/isize 是必需的
cast_sign_loss = "allow"          # 频率值总是正数
cast_lossless = "allow"           # 音频代码中类型转换很常见
suboptimal_flops = "allow"        # 保持代码可读性
inline_always = "allow"           # 音频热路径需要内联
# Windows API/状态结构
struct_field_names = "allow"      # LyricsLayout 字段都以 _rect 结尾,语义清晰
struct_excessive_bools = "allow"  # SharedLyricState 需要多个状态标志
# 框架生成代码
large_stack_frames = "allow"      # Tauri宏生成
too_many_lines = "allow"          # main函数需要初始化很多东西
used_underscore_binding = "allow" # Tauri setup回调
# 代码风格偏好
collapsible_if = "allow"          # 有时分开写更清晰
too_many_arguments = "allow"      # 音频处理函数需要多参数
items_after_statements = "allow"  # 常量定义在使用处附近更清晰
significant_drop_tightening = "allow" # Mutex guard生命周期由编译器管理
match_same_arms = "allow"         # 有时显式写出更清晰
type_complexity = "allow"         # 音频初始化返回复杂类型
option_if_let_else = "allow"      # match有时比map_or_else更清晰
missing_const_for_fn = "allow"    # 不是所有函数都需要const
manual_let_else = "allow"         # match有时比let else更清晰
redundant_closure_for_method_calls = "allow" # 闭包有时更清晰
map_unwrap_or = "allow"           # map().unwrap_or()有时更清晰
# 额外的严格检查
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# 启用 IMMNotificationClient 事件驱动设备监听（实验性，默认禁用）
imm-notification = []

[[bin]]
name = "mercurial-player"
path = "src/main.rs"

[profile.dev]
opt-level = 0
debug = true
incremental = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
debug = false
