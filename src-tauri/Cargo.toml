[package]
name = "mercurial-player"
version = "1.6.2"
description = "A music player by JDBeWL"
authors = ["jdbEwl"]
license = "GPL-3.0"
repository = "https://github.com/JDBeWL/Mercurial-Player"
edition = "2024"
rust-version = "1.92"
default-run = "mercurial-player"

[lib]
name = "mercurial_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["protocol-asset", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rodio = { version = "0.22", default-features = false, features = ["playback"] }
cpal = "0.17"
dirs = "6"
walkdir = "2"
lofty = "0.24"
symphonia = { version = "0.6", features = ["all"] }
rubato = "4.0"
audioadapter-buffers = "4.0"
rayon = "1"
spectrum-analyzer = "1.7"
microfft = { version = "0.6", features = ["size-512"] }
beat-this = { version = "1.1", default-features = false }
log = "0.4"
tauri-plugin-log = "2.10"
tauri-plugin-dialog = "2.8"
tauri-plugin-fs = "2.7"
tauri-plugin-http = { version = "2.8", features = ["stream"] }
tauri-plugin-opener = "2.7"
tauri-plugin-process = "2.4"
tauri-plugin-updater = "2.14"
tauri-plugin-store = "2.5"
tauri-plugin-global-shortcut = "2.4"

crossbeam-channel = "0.5"
unicode-segmentation = "1"
tokio = { version = "1", features = ["time", "fs", "io-util"] }
ttf-parser = "0.25.1"
futures-util = "0.3"
minisign-verify = "0.2"
base64 = "0.22"
flate2 = "1"
md-5 = "0.10"
anyhow = "1.0.104"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "decode"
harness = false

[[bench]]
name = "equalizer"
harness = false

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
display-info = "0.5"

[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["load-dynamic", "directml", "api-24"] }
libloading = "0.9"
wasapi = "0.23"
winreg = "0.56"
windows-core = "0.62"
windows-implement = "0.60"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Media_Audio",
] }
windows-numerics = "0.3"


[lints.rust]
unsafe_code = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_qualifications = "warn"
variant_size_differences = "warn"
keyword_idents_2024 = "forbid"
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
needless_pass_by_value = "allow"
must_use_candidate = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
suboptimal_flops = "allow"
inline_always = "allow"
struct_field_names = "allow"
struct_excessive_bools = "allow"
large_stack_frames = "allow"
too_many_lines = "allow"
used_underscore_binding = "allow"
collapsible_if = "allow"
too_many_arguments = "allow"
items_after_statements = "allow"
significant_drop_tightening = "warn"
match_same_arms = "allow"
type_complexity = "allow"
option_if_let_else = "allow"
missing_const_for_fn = "allow"
manual_let_else = "allow"
redundant_closure_for_method_calls = "allow"
map_unwrap_or = "allow"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
imm-notification = []

[[bin]]
name = "mercurial-player"
path = "src/main.rs"

[profile.dev]
opt-level = 0
debug = true
incremental = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
debug = false
