name: CI/CD

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Version consistency check
        run: pnpm run version:check

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test (coverage gate)
        run: pnpm run test:coverage

      - name: Build frontend
        run: pnpm run build

  rust-checks:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.platform }}

      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm run build

      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: src-tauri
        run: cargo test

      - name: Cargo check (release)
        if: matrix.platform == 'ubuntu-latest'
        working-directory: src-tauri
        run: cargo check --release

  android-checks:
    runs-on: ubuntu-latest
    env:
      ANDROID_TARGET: aarch64-linux-android
      API_LEVEL: '24'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: clippy

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: android

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm run build

      - name: Export NDK toolchain for cc-rs
        run: |
          set -euo pipefail
          NDK="$(ls -d "$ANDROID_HOME"/ndk/*/ | sort -V | tail -1)"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          {
            echo "CC_$ANDROID_TARGET=$TC/bin/clang"
            echo "CXX_$ANDROID_TARGET=$TC/bin/clang++"
            echo "AR_$ANDROID_TARGET=$TC/bin/llvm-ar"
            echo "CFLAGS_$ANDROID_TARGET=--target=$ANDROID_TARGET$API_LEVEL --sysroot=$TC/sysroot"
            echo "CXXFLAGS_$ANDROID_TARGET=--target=$ANDROID_TARGET$API_LEVEL --sysroot=$TC/sysroot"
          } >> "$GITHUB_ENV"
          echo "使用 NDK: $NDK"

      - name: Clippy (android)
        working-directory: src-tauri
        run: cargo clippy --target "$ANDROID_TARGET" --lib -- -D warnings

  build-tauri:
    needs: [build-frontend, rust-checks]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            args: ''
          - platform: macos-latest
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.platform }}-release

      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: Build and Release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tauriScript: pnpm run tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'Mercurial Player ${{ github.ref_name }}'
          releaseBody: |
            ## 下载安装 / Download & Install

            | 平台 / Platform | 文件 / File |
            |----------------|-------------|
            | Windows | `.exe` |
            | macOS | `.dmg` (Universal) |
            | Linux | `.deb` 或 `.AppImage` |

            ### 校验文件 / Checksum

            - 本次 Release 包含 `SHA256SUMS`，可用于校验安装包完整性。

            ---

            > 首次使用？查看 [README](https://github.com/${{ github.repository }}#readme) 了解更多。
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      - name: Generate Windows SHA256SUMS
        if: startsWith(github.ref, 'refs/tags/') && matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $files = @()

          $files += Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue

          if ($files.Count -eq 0) {
            throw "No Windows installer files found for checksum generation."
          }

          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($f.Name)"
          }

          $lines | Set-Content -Path "SHA256SUMS" -Encoding ascii
          Get-Content "SHA256SUMS"

      - name: Upload SHA256SUMS to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && matrix.platform == 'windows-latest'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
