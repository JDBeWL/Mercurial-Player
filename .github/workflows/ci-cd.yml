name: CI/CD

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# 同一分支/PR 的新推送取消旧的 CI 运行，节省资源（Tauri 三平台构建很慢）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build frontend
        run: pnpm run build

  # Rust 检查（lint / 格式 / 测试 / 编译验证）
  # 在 PR 和 main 推送时运行，确保 Rust 代码可编译且符合规范
  rust-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install system dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: src-tauri
        run: cargo test

      - name: Cargo check (release)
        working-directory: src-tauri
        run: cargo check --release

  # Tauri 应用构建和发布
  build-tauri:
    needs: [build-frontend, rust-checks]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            args: ''
          - platform: macos-latest
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: Build and Release Tauri app
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # updater 签名密钥：没有此密钥不会生成 .sig 文件和 latest.json
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tauriScript: pnpm run tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'Mercurial Player ${{ github.ref_name }}'
          releaseBody: |
            ## 下载安装 / Download & Install

            | 平台 / Platform | 文件 / File |
            |----------------|-------------|
            | Windows | `.msi` 或 `.exe` |
            | macOS | `.dmg` (Universal) |
            | Linux | `.deb` 或 `.AppImage` |

            ### 校验文件 / Checksum

            - 本次 Release 包含 `SHA256SUMS`，可用于校验安装包完整性。

            ---

            > 首次使用？查看 [README](https://github.com/${{ github.repository }}#readme) 了解更多。
          releaseDraft: false
          prerelease: false
          # 生成 latest.json 供 Tauri updater 使用
          # Windows 优先使用 NSIS（.nsis.zip + .nsis.zip.sig）
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      - name: Generate Windows SHA256SUMS
        if: startsWith(github.ref, 'refs/tags/') && matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $files = @()

          $files += Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          $files += Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue

          if ($files.Count -eq 0) {
            throw "No Windows installer files found for checksum generation."
          }

          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($f.Name)"
          }

          $lines | Set-Content -Path "SHA256SUMS" -Encoding ascii
          Get-Content "SHA256SUMS"

      - name: Upload SHA256SUMS to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && matrix.platform == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
